[package]
name = "c2pa-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "c2pa_ffi"
crate-type = ["cdylib"]

[dependencies]
# C2PA library for content authenticity (no OpenSSL — we bring our own signer via CallbackSigner)
c2pa = { version = "0.36", features = ["unstable_api"] }

# JNI bindings for Android
jni = "0.21"

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Self-signed certificate generation (pure Rust, ring backend)
rcgen = "0.12"

# Ring for ECDSA P-256 signing (already a transitive dep of c2pa / x509-certificate)
ring = "0.17"

# Base64 encoding for key storage
base64 = "0.22"

# Logging
log = "0.4"
android_logger = "0.14"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"
